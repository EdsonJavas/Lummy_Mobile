org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.lang=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=false
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx512m
org.gradle.workers.max=1
kotlin.daemon.enabled=true
# Disabled due to configuration cache serialization error on Java 17/21 toolchains
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
kotlin.incremental.useClasspathSnapshot=true
android.nonTransitiveRClass=true
