name: lummy
description: Lummy - educação financeira para famílias

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.7
  iconsax_flutter: ^1.0.1
  # Ícones Lucide do redesenho infantil (VINGADORES). Os desenhos usados nas
  # telas novas ficam em lib/screens/child/widgets/v1/lummy_glyphs.dart.
  lucide_icons_flutter: ^4.0.3
  google_fonts: ^8.0.2
  image_picker: ^1.0.4
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  intl: ^0.20.2
  fl_chart: ^1.1.0
  supabase_flutter: ^2.5.6
  get_it: ^9.1.1
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - dark.png
    # Astronauta mascote (cofrinho, dica do Lummy). Copiado do mockup aprovado.
    - assets/images/astronauta.svg
